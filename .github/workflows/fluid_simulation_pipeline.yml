name: Fluid Particle Simulation and Commit

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  code_quality_check:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: ♻️ Install Universal Robot Note Hook
        run: |
          mkdir -p .git/hooks
          cat <<'EOF' > .git/hooks/post-commit
          #!/bin/sh
          git notes add -m "robot: true" || true
          git push origin refs/notes/* || true
          EOF
          chmod +x .git/hooks/post-commit

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Run autoflake to remove unused imports
        run: |
          autoflake --in-place --recursive --remove-unused-variables --remove-all-unused-imports src

      - name: 💀 Run vulture to find dead code
        run: |
          vulture src || echo "⚠️ Vulture found unused code — review manually if needed"

      - name: 🚀 Commit autoflake changes
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: auto-clean unused imports & variables"
            git notes add -m "robot: true"
            git push origin HEAD
          else
            echo "No autoflake changes to commit."
          fi
          
  process_fluid_data:
    needs: code_quality_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: ♻️ Install Universal Robot Note Hook
        run: |
          mkdir -p .git/hooks
          cat <<'EOF' > .git/hooks/post-commit
          #!/bin/sh
          git notes add -m "robot: true" || true
          git push origin refs/notes/* || true
          EOF
          chmod +x .git/hooks/post-commit

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system dependencies (TBB required)
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade numpy h5py scipy pytest dropbox
          pip install -r requirements.txt

      - name: Debug Repository Structure
        run: ls -R "$GITHUB_WORKSPACE"

      - name: Delete All Previous Files in Testing-Input-Output
        run: |
          if [ -d "$GITHUB_WORKSPACE/data/testing-input-output/" ]; then
            rm -rf "$GITHUB_WORKSPACE/data/testing-input-output/*"
            echo "🗑️ Deleted all files inside data/testing-input-output/."
          else
            echo "ℹ️ No previous files found — proceeding."
          fi
      
      - name: Make download_from_dropbox.sh Executable
        run: chmod +x src/download_from_dropbox.sh
  
      - name: Download Simulation Files from Dropbox
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: src/download_from_dropbox.sh

      - name: Run Fluid Particle Processing Script
        env:
          OUTPUT_FORMAT: json
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python input_builder.py

      - name: Debug Directory After Processing
        run: ls -R "$GITHUB_WORKSPACE/data/testing-input-output"

      - name: Run All Tests
        run: pytest tests/ --verbose

      - name: Make upload_to_dropbox.sh Executable
        run: chmod +x src/upload_to_dropbox.sh
  
      - name: Debug Before Dropbox Upload
        run: |
          echo "🔍 Checking directory structure before upload..."
          ls -R $GITHUB_WORKSPACE
  
      - name: Upload Fluid Simulation Input to Dropbox
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: src/upload_to_dropbox.sh

      - name: 📝 Log trigger for STEP processor
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S'): STEP processor triggered by '${{ github.actor }}' via '${{ github.event_name }}'" >> trigger.txt

      - name: 🚀 Commit and push trigger log
        run: |
          git pull --rebase origin main || echo "⚠️ Pull failed or not needed"
          git add trigger.txt

          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: STEP processor trigger log"
            git push origin main
          else
            echo "No new trigger log to commit."
          fi